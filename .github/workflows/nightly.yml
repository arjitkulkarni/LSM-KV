name: nightly-crash-matrix

on:
  schedule:
    - cron: "17 3 * * *"   # every night, 03:17 UTC
  workflow_dispatch:
    inputs:
      iterations:
        description: "Crash iterations"
        default: "200"

jobs:
  crash-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14
      - run: |
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_BUILD_TYPE=Release -DLSMKV_BUILD_TESTS=OFF -DLSMKV_BUILD_BENCH=OFF
          cmake --build build --parallel
      - name: 200-iteration SIGKILL / torn-tail / fsync-failure matrix
        run: |
          python3 tools/crash_matrix.py --build build \
            --iterations ${{ github.event.inputs.iterations || '200' }} \
            --seed ${{ github.run_id }} \
            --out results/crash_matrix_nightly.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crash-matrix-${{ github.run_id }}
          path: results/crash_matrix_nightly.json
